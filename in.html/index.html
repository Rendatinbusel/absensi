<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Survei Kepuasan Masyarakat</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 700px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      padding: 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h2 {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .page-indicator {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 15px;
      display: inline-block;
      background-color: #eff6ff;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .form-page {
      display: none;
    }

    .form-page.active {
      display: block;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 12px 12px 12px 40px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: var(--primary);
    }

    .radio-group-vertical, .radio-group-horizontal {
      display: flex;
      gap: 12px;
    }

    .radio-group-vertical {
      flex-direction: column;
    }

    .radio-group-horizontal {
      flex-wrap: wrap;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.2s;
    }

    .radio-option:hover {
      background-color: #f8fafc;
    }

    .radio-option input[type="radio"] {
      accent-color: var(--primary);
    }

    .question-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .question-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }

    .btn-group {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      gap: 10px;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      margin-left: auto;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: var(--text-color);
    }

    .btn-secondary:hover {
      background-color: #cbd5e1;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Modal Popup */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .modal-content h3 {
      color: #16a34a;
      margin-bottom: 10px;
    }

    .modal-content button {
      margin-top: 20px;
      background-color: var(--primary);
      color: white;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Survei Kepuasan Masyarakat</h2>
      <p>Mohon isi formulir di bawah ini untuk membantu kami meningkatkan kualitas pelayanan.</p>
    </div>

    <form id="formSurvey" onsubmit="kirimData(event)">
      
      <!-- HALAMAN 1: Jenis Layanan -->
      <div id="page1" class="form-page active">
        <span class="page-indicator">Halaman 1 dari 3</span>
        
        <div class="input-group">
          <label>Jenis Layanan yang Diterima</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            </div>
            <select name="jenis_layanan" required>
              <option value="">-- Pilih Jenis Layanan --</option>
              <option value="Layanan Informasi Publik">Layanan Informasi Publik</option>
              <option value="Layanan Pendaftaran">Layanan Pendaftaran</option>
              <option value="Layanan Pengaduan">Layanan Pengaduan</option>
              <option value="Layanan Administrasi Umum">Layanan Administrasi Umum</option>
            </select>
          </div>
        </div>

        <div class="btn-group">
          <button type="button" class="btn-primary" onclick="nextPage(2)">Lanjut</button>
        </div>
      </div>

      <!-- HALAMAN 2: Profil Responden -->
      <div id="page2" class="form-page">
        <span class="page-indicator">Halaman 2 dari 3</span>

        <div class="input-group">
          <label for="nama">Nama Lengkap</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <input type="text" name="nama" id="nama" placeholder="Masukkan nama lengkap Anda..." required>
          </div>
        </div>

        <div class="input-group">
          <label>Jenis Kelamin</label>
          <div class="radio-group-horizontal">
            <label class="radio-option">
              <input type="radio" name="jenis_kelamin" value="Laki-laki" required> Laki-laki
            </label>
            <label class="radio-option">
              <input type="radio" name="jenis_kelamin" value="Perempuan"> Perempuan
            </label>
          </div>
        </div>

        <div class="input-group">
          <label for="usia">Usia (Tahun)</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
            <input type="number" name="usia" id="usia" placeholder="Contoh: 25" min="15" max="100" required>
          </div>
        </div>

        <div class="input-group">
          <label>Pendidikan Terakhir</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
            </div>
            <select name="pendidikan" required>
              <option value="">-- Pilih Pendidikan --</option>
              <option value="SD/Sederajat">SD / Sederajat</option>
              <option value="SMP/Sederajat">SMP / Sederajat</option>
              <option value="SMA/Sederajat">SMA / Sederajat</option>
              <option value="D1/D2/D3">D1 / D2 / D3</option>
              <option value="S1/D4">S1 / D4</option>
              <option value="S2/S3">S2 / S3</option>
            </select>
          </div>
        </div>

        <div class="input-group">
          <label for="pekerjaan">Pekerjaan</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            </div>
            <input type="text" name="pekerjaan" id="pekerjaan" placeholder="Contoh: PNS, Swasta, Wiraswasta" required>
          </div>
        </div>

        <div class="input-group">
          <label>Penyandang Disabilitas?</label>
          <div class="radio-group-horizontal">
            <label class="radio-option">
              <input type="radio" name="is_disabilitas" value="Ya" onchange="toggleDisabilitas(true)" required> Ya
            </label>
            <label class="radio-option">
              <input type="radio" name="is_disabilitas" value="Tidak" onchange="toggleDisabilitas(false)" checked> Tidak
            </label>
          </div>
        </div>

        <div class="input-group" id="disabilitas_field" style="display: none;">
          <label for="jenis_disabilitas">Jenis Disabilitas</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            </div>
            <input type="text" name="jenis_disabilitas" id="jenis_disabilitas" placeholder="Sebutkan jenis disabilitas...">
          </div>
        </div>

        <div class="btn-group">
          <button type="button" class="btn-secondary" onclick="prevPage(1)">Kembali</button>
          <button type="button" class="btn-primary" onclick="nextPage(3)">Lanjut</button>
        </div>
      </div>

      <!-- HALAMAN 3: Pertanyaan Kuesioner (16 Soal) -->
      <div id="page3" class="form-page">
        <span class="page-indicator">Halaman 3 dari 3</span>

        <div id="questions-container"></div>

        <div class="btn-group">
          <button type="button" class="btn-secondary" onclick="prevPage(2)">Kembali</button>
          <button type="submit" id="tombol" class="btn-primary">
            <span id="btn-text">Kirim Survei</span>
          </button>
        </div>
      </div>

    </form>
  </div>

  <!-- Popup Sukses -->
  <div class="modal-overlay" id="popupModal">
    <div class="modal-content">
      <h3>Terima Kasih!</h3>
      <p>Data survei Anda telah berhasil dikirim dan tersimpan di database.</p>
      <button onclick="closeModal()">Tutup</button>
    </div>
  </div>

  <script>
    // URL Web App Google Apps Script Anda
    const SCRIPT_URL = 'MASUKKAN_URL_WEB_APP_HASIL_DEPLOY_BARU';

    // Daftar Pertanyaan Kuesioner (16 Butir)
    const questions = [
      "Bagaimana pendapat Anda tentang kemudahan prosedur pelayanan di unit ini?",
      "Bagaimana kesesuaian persyaratan pelayanan dengan jenis pelayanannya?",
      "Bagaimana kejelasan dan kepastian petugas yang memberikan pelayanan?",
      "Bagaimana kedisiplinan petugas dalam memberikan pelayanan?",
      "Bagaimana tanggung jawab petugas dalam memberikan pelayanan?",
      "Bagaimana kemampuan petugas dalam memberikan pelayanan?",
      "Bagaimana kecepatan pelayanan di unit ini?",
      "Bagaimana keadilan mendapatkan pelayanan di sini?",
      "Bagaimana kesopanan dan keramahan petugas dalam memberikan pelayanan?",
      "Bagaimana kewajaran biaya untuk mendapatkan pelayanan?",
      "Bagaimana kesesuaian antara biaya yang dibayarkan dengan yang ditetapkan?",
      "Bagaimana ketepatan pelaksanaan terhadap jadwal waktu pelayanan?",
      "Bagaimana kenyamanan di lingkungan unit pelayanan?",
      "Bagaimana keamanan pelayanan di unit ini?",
      "Bagaimana penanganan pengaduan pengguna layanan?",
      "Bagaimana kualitas sarana dan prasarana pelayanan secara umum?"
    ];

    // Render Pertanyaan secara Dinamis
    function renderQuestions() {
      const container = document.getElementById('questions-container');
      questions.forEach((q, index) => {
        const qNum = index + 1;
        const html = `
          <div class="question-card">
            <div class="question-title">${qNum}. ${q}</div>
            <div class="radio-group-horizontal">
              <label class="radio-option">
                <input type="radio" name="q${qNum}" value="1" required> Tidak Baik
              </label>
              <label class="radio-option">
                <input type="radio" name="q${qNum}" value="2"> Kurang Baik
              </label>
              <label class="radio-option">
                <input type="radio" name="q${qNum}" value="3"> Baik
              </label>
              <label class="radio-option">
                <input type="radio" name="q${qNum}" value="4"> Sangat Baik
              </label>
            </div>
          </div>
        `;
        container.innerHTML += html;
      });
    }

    renderQuestions();

    // Navigasi Halaman
    function nextPage(page) {
      if (validateCurrentPage(page - 1)) {
        document.querySelectorAll('.form-page').forEach(p => p.classList.remove('active'));
        document.getElementById(`page${page}`).classList.add('active');
        window.scrollTo(0, 0);
      }
    }

    function prevPage(page) {
      document.querySelectorAll('.form-page').forEach(p => p.classList.remove('active'));
      document.getElementById(`page${page}`).classList.add('active');
      window.scrollTo(0, 0);
    }

    // Toggle Input Disabilitas
    function toggleDisabilitas(show) {
      const field = document.getElementById('disabilitas_field');
      const input = document.getElementById('jenis_disabilitas');
      field.style.display = show ? 'block' : 'none';
      if (!show) input.value = '';
    }

    // Validasi Form per Halaman
    function validateCurrentPage(currentPage) {
      const activePageEl = document.getElementById(`page${currentPage}`);
      const inputs = activePageEl.querySelectorAll('input[required], select[required]');
      
      for (let input of inputs) {
        if (input.type === 'radio') {
          const radioGroup = activePageEl.querySelectorAll(`input[name="${input.name}"]`);
          const checked = Array.from(radioGroup).some(r => r.checked);
          if (!checked) {
            alert('Mohon lengkapi semua pilihan yang wajib diisi.');
            return false;
          }
        } else if (!input.value.trim()) {
          alert('Mohon isi semua bidang yang wajib diisi.');
          input.focus();
          return false;
        }
      }
      return true;
    }

    // Kirim Data ke Google Apps Script
    function kirimData(event) {
      event.preventDefault();
      
      const tombol = document.getElementById("tombol");
      const btnText = document.getElementById("btn-text");
      
      tombol.disabled = true; 
      btnText.innerText = "Mengirim..."; 
      
      const form = document.getElementById("formSurvey");
      const formData = new FormData(form);
      const dataObj = Object.fromEntries(formData.entries());

      fetch(SCRIPT_URL, { 
        method: 'POST', 
        body: JSON.stringify(dataObj) 
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "success") {
          document.getElementById('popupModal').classList.add('active');
          form.reset();
          prevPage(1);
        } else {
          alert("Terjadi kesalahan: " + data.message);
        }
        tombol.disabled = false; 
        btnText.innerText = "Kirim Survei";
      })
      .catch(error => {
        alert("Gagal mengirim data. Pastikan koneksi internet stabil.");
        tombol.disabled = false; 
        btnText.innerText = "Kirim Survei";
      });
    }

    function closeModal() {
      document.getElementById('popupModal').classList.remove('active');
    }
  </script>
</body>
</html>
