<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Kehadiran</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body { 
        font-family: 'Poppins', sans-serif; 
        /* Background Gradasi Merah ke Oranye */
        background: linear-gradient(135deg, #d32f2f 0%, #f57c00 100%); 
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; 
        padding: 20px; box-sizing: border-box;
      }
      
      body::before, body::after {
        content: ''; position: fixed; border-radius: 50%; background: rgba(255,255,255,0.15); z-index: 0;
      }
      body::before { top: -100px; left: -100px; width: 300px; height: 300px; }
      body::after { bottom: -100px; right: -100px; width: 400px; height: 400px; }

      .card { 
        background: #ffffff; padding: 40px 30px; border-radius: 24px; width: 100%; max-width: 420px; 
        box-shadow: 0 20px 50px rgba(0,0,0,0.3); animation: fadeIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        position: relative; z-index: 1;
      }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(-30px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
      
      .header-icon { 
        text-align: center; margin-bottom: 15px; 
        background: #fff3e0; width: 100px; height: 100px; 
        border-radius: 50%; display: flex; align-items: center; justify-content: center; 
        margin-left: auto; margin-right: auto; box-shadow: 0 5px 15px rgba(245, 124, 0, 0.3);
      }
      h2 { text-align: center; color: #d32f2f; font-weight: 700; margin-top: 0; margin-bottom: 10px; font-size: 24px; }
      .subtitle { text-align: center; color: #6b7280; font-size: 13px; margin-bottom: 30px; display: block; }
      
      .input-group { margin-bottom: 20px; }
      label { display: block; font-size: 13px; font-weight: 600; color: #4b5563; margin-bottom: 8px; margin-left: 5px; }
      
      .input-wrapper { position: relative; }
      .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #f57c00; pointer-events: none; }
      
      input[type="text"], input[type="number"] { 
        width: 100%; padding: 14px 15px 14px 45px; border: 1.5px solid #e5e7eb; border-radius: 12px; 
        font-size: 14px; font-family: 'Poppins', sans-serif; box-sizing: border-box; background-color: #f9fafb;
        transition: all 0.3s ease;
      }
      input:focus { border-color: #f57c00; outline: none; background-color: #fff; box-shadow: 0 0 0 4px rgba(245, 124, 0, 0.1); }
      
      input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      input[type=number] { -moz-appearance: textfield; }

      .file-upload-wrapper { position: relative; width: 100%; height: 65px; }
      .file-upload-wrapper input[type="file"] { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; }
      .custom-file-btn { 
        position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; 
        gap: 10px; background-color: #f9fafb; border: 2px dashed #d1d5db; border-radius: 12px; color: #6b7280; font-weight: 500; font-size: 14px; z-index: 1;
        transition: all 0.3s ease;
      }
      .file-upload-wrapper input[type="file"]:hover + .custom-file-btn { background-color: #fff3e0; border-color: #f57c00; color: #f57c00; }
      
      button[type="submit"] { 
        width: 100%; padding: 16px; 
        background: linear-gradient(135deg, #d32f2f 0%, #f57c00 100%); color: white; border: none; 
        border-radius: 12px; font-size: 16px; font-weight: 600; font-family: 'Poppins', sans-serif; cursor: pointer; margin-top: 10px; 
        transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(211, 47, 47, 0.4);
        display: flex; align-items: center; justify-content: center; gap: 10px;
      }
      button[type="submit"]:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245, 124, 0, 0.5); }
      button[type="submit"]:disabled { background: #9ca3af; cursor: not-allowed; transform: none; box-shadow: none; }
      
      .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .modal-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 9999;
        justify-content: center; align-items: center; animation: fadeBg 0.3s ease;
      }
      .modal-overlay.active { display: flex; }
      @keyframes fadeBg { from { opacity: 0; } to { opacity: 1; } }

      .modal-box {
        background: #fff; padding: 30px; border-radius: 20px; width: 90%; max-width: 350px;
        text-align: center; animation: scaleUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      }
      @keyframes scaleUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      
      .modal-icon { width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; }
      .modal-icon.success { background: #d1fae5; color: #10b981; }
      .modal-icon.error { background: #fee2e2; color: #ef4444; }
      
      .modal-box h3 { margin: 0 0 10px; color: #d32f2f; font-size: 20px; }
      .modal-box p { margin: 0 0 25px; color: #6b7280; font-size: 14px; line-height: 1.5; }
      .modal-btn { background: linear-gradient(135deg, #d32f2f 0%, #f57c00 100%); color: #fff; border: none; padding: 12px 30px; border-radius: 10px; font-family: 'Poppins', sans-serif; font-weight: 600; cursor: pointer; width: 100%; transition: 0.3s; }
      .modal-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(211, 47, 47, 0.3); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header-icon">
        <!-- Logo KPU Asli (SVG) -->
       <img src="https://www.kpu.go.id/images/1627539868logo-kpu.png" style="width: 65px; height: auto;" />
      </div>
      <h2>Absensi Pegawai</h2>
      <span class="subtitle">Komisi Pemilihan Umum Kabupaten Buton Selatan</span>
      
      <form id="formAbsen" onsubmit="kirimData(event)">
        <div class="input-group">
          <label>Nama Lengkap</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <input type="text" id="nama" placeholder="Masukkan nama..." required>
          </div>
        </div>
        
        <div class="input-group">
          <label>NIP</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
            </div>
            <input type="number" id="nip" placeholder="Masukkan NIP..." inputmode="numeric" required>
          </div>
        </div>
        
        <div class="input-group">
          <label>Jabatan</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            </div>
            <input type="text" id="jabatan" placeholder="Masukkan jabatan..." required>
          </div>
        </div>
        
        <div class="input-group">
          <label>Swafoto (Selfie)</label>
          <div class="file-upload-wrapper">
            <input type="file" id="foto" accept="image/*" capture="user" required onchange="ubahTeksFoto(this)">
            <div class="custom-file-btn" id="teks-tombol-foto">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle>
              </svg>
              <span>Ketuk untuk foto</span>
            </div>
          </div>
        </div>
        
        <button type="submit" id="tombol">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="btn-icon"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          <span id="btn-text">Kirim Absensi</span>
        </button>
      </form>
    </div>

    <!-- Struktur Modal Pop-Up -->
    <div class="modal-overlay" id="popupModal">
      <div class="modal-box">
        <div class="modal-icon" id="modalIcon"></div>
        <h3 id="modalTitle">Berhasil!</h3>
        <p id="modalMessage">Data absensi Anda telah berhasil terkirim.</p>
        <button class="modal-btn" onclick="tutupModal()">Tutup</button>
      </div>
    </div>

    <script>
      const scriptURL = 'https://script.google.com/macros/s/AKfycbzQVKzVDrQWKeqKF6_C8YEc3SpFRok6025IzssOcrNoJJkSAAC-Urg0h53huFSTa20b/exec';

      function ubahTeksFoto(input) {
        var teksTombol = document.getElementById('teks-tombol-foto');
        if (input.files && input.files[0]) {
          teksTombol.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg><span style="color:#10b981;">Foto Siap!</span>`;
          teksTombol.style.borderColor = "#10b981"; teksTombol.style.backgroundColor = "#ecfdf5";
        } else {
          teksTombol.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg><span style="color:#6b7280;">Ketuk untuk foto</span>`;
          teksTombol.style.borderColor = "#d1d5db"; teksTombol.style.backgroundColor = "#f9fafb";
        }
      }

      function kompresGambar(file, callback) {
        var reader = new FileReader(); reader.readAsDataURL(file);
        reader.onload = function(e) {
          var img = new Image(); img.src = e.target.result;
          img.onload = function() {
            var canvas = document.createElement('canvas'); var ctx = canvas.getContext('2d');
            var maxWidth = 800; var maxHeight = 800; var width = img.width; var height = img.height;
            if (width > height) { if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; } } 
            else { if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; } }
            canvas.width = width; canvas.height = height; ctx.drawImage(img, 0, 0, width, height);
            callback(canvas.toDataURL('image/jpeg', 0.7));
          }
        }
      }

      function tampilkanModal(status, message) {
        var modal = document.getElementById('popupModal');
        var icon = document.getElementById('modalIcon');
        var title = document.getElementById('modalTitle');
        var msg = document.getElementById('modalMessage');

        msg.innerText = message;

        if(status === 'success') {
          icon.className = "modal-icon success";
          icon.innerHTML = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
          title.innerText = "Absensi Berhasil!";
        } else {
          icon.className = "modal-icon error";
          icon.innerHTML = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';
          title.innerText = "Terjadi Kesalahan";
        }
        modal.classList.add('active');
      }

      function tutupModal() {
        document.getElementById('popupModal').classList.remove('active');
      }

      function kirimData(event) {
        event.preventDefault();
        
        var fileFoto = document.getElementById("foto").files[0];
        if (!fileFoto) {
          tampilkanModal('error', "Silakan unggah swafoto terlebih dahulu!");
          return;
        }

        var tombol = document.getElementById("tombol");
        var btnText = document.getElementById("btn-text");
        var btnIcon = document.getElementById("btn-icon");
        
        tombol.disabled = true; 
        btnText.innerText = "Mengirim Data..."; 
        btnIcon.outerHTML = '<div class="spinner" id="btn-icon"></div>';

        kompresGambar(fileFoto, function(base64) {
          var dataObj = {
            nama: document.getElementById("nama").value,
            nip: document.getElementById("nip").value,
            jabatan: document.getElementById("jabatan").value,
            fotoBase64: base64
          };

          fetch(scriptURL, { method: 'POST', body: JSON.stringify(dataObj) })
          .then(response => response.json())
          .then(data => {
            if (data.status === "success") {
              tampilkanModal('success', data.message);
              document.getElementById("formAbsen").reset();
              ubahTeksFoto(document.getElementById("foto")); 
            } else {
              tampilkanModal('error', data.message);
            }
            tombol.disabled = false; 
            btnText.innerText = "Kirim Absensi";
            document.getElementById("btn-icon").outerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="btn-icon"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
          })
          .catch(error => {
            tampilkanModal('error', "Terjadi kesalahan jaringan, coba lagi.");
            tombol.disabled = false; 
            btnText.innerText = "Kirim Absensi";
            document.getElementById("btn-icon").outerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="btn-icon"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
          });
        });
      }
    </script>
  </body>
</html>
