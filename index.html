<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Online</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }
      .card {
        background: #ffffff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
      }
      h2 {
        text-align: center; color: #333; margin-bottom: 20px;
      }
      .form-group { margin-bottom: 15px; }
      label {
        display: block; margin-bottom: 5px; font-weight: bold; color: #555;
      }
      input {
        width: 100%; padding: 10px; border: 1px solid #ccc;
        border-radius: 5px; box-sizing: border-box; font-size: 14px;
      }
      input[type="file"] { background: #f9f9f9; padding: 8px; }
      button {
        width: 100%; padding: 12px; background-color: #007bff; color: white;
        border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px;
      }
      button:hover { background-color: #0056b3; }
      button:disabled { background-color: #ccc; cursor: not-allowed; }
      #status-msg { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Absensi Kehadiran</h2>
      <form id="absensiForm" onsubmit="submitForm(event)">
        <div class="form-group">
          <label for="nama">Nama Lengkap:</label>
          <input type="text" id="nama" required placeholder="Masukkan Nama...">
        </div>
        <div class="form-group">
          <label for="nip">NIP:</label>
          <input type="number" id="nip" required placeholder="Masukkan NIP...">
        </div>
        <div class="form-group">
          <label for="jabatan">Jabatan:</label>
          <input type="text" id="jabatan" required placeholder="Masukkan Jabatan...">
        </div>
        <div class="form-group">
          <label for="swafoto">Swafoto (Selfie):</label>
          <input type="file" id="swafoto" accept="image/*" capture="user" required>
        </div>
        <button type="submit" id="btnSubmit">Kirim Absensi</button>
      </form>
      <div id="status-msg"></div>
    </div>

    <script>
      // GANTI URL DI BAWAH INI DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT ANDA
      const scriptURL = 'MASUKKAN_URL_WEB_APP_ANDA_DISINI';

      function compressImage(file, callback) {
        var reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function(e) {
          var img = new Image();
          img.src = e.target.result;
          img.onload = function() {
            var canvas = document.createElement('canvas');
            var ctx = canvas.getContext('2d');
            var MAX_WIDTH = 800;
            var MAX_HEIGHT = 800;
            var width = img.width;
            var height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }
            canvas.width = width; canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            
            var dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            callback(dataUrl);
          }
        }
      }

      function submitForm(event) {
        event.preventDefault();
        var btn = document.getElementById("btnSubmit");
        var msg = document.getElementById("status-msg");
        var fileInput = document.getElementById("swafoto");
        var file = fileInput.files[0];
        
        btn.disabled = true;
        btn.innerText = "Mengunggah Data & Foto...";
        msg.innerText = "";
        
        compressImage(file, function(base64Image) {
          var dataObj = {
            nama: document.getElementById("nama").value,
            nip: document.getElementById("nip").value,
            jabatan: document.getElementById("jabatan").value,
            fotoBase64: base64Image
          };

          // Proses pengiriman data ke Google Apps Script via API
          fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(dataObj)
            // Catatan: Tidak menggunakan header 'Content-Type' untuk menghindari error CORS (Preflight)
          })
          .then(response => response.json())
          .then(data => {
            if (data.status === "success") {
              msg.innerText = data.message;
              msg.style.color = "green";
              document.getElementById("absensiForm").reset();
            } else {
              msg.innerText = "Gagal: " + data.message;
              msg.style.color = "red";
            }
            btn.disabled = false;
            btn.innerText = "Kirim Absensi";
          })
          .catch(error => {
            msg.innerText = "Terjadi kesalahan jaringan!";
            msg.style.color = "red";
            btn.disabled = false;
            btn.innerText = "Kirim Absensi";
            console.error('Error!', error.message);
          });
        });
      }
    </script>
  </body>
</html>
